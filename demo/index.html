<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Clock Card preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0e1014; color: #f6f5f7;
    font-family: Inter, Roboto, Arial, sans-serif; }
  main { width: min(100%, 1080px); margin: auto; padding: 72px 34px 88px; }
  .overline { color: #a7a5b4; font-size: 12px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; }
  h1 { margin: 11px 0 7px; font-size: clamp(34px, 5vw, 54px); letter-spacing: -.05em; }
  .intro { margin: 0 0 44px; color: #b1afbb; font-size: 16px; }
  .panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; align-items: start; }
  .panel-label { display: flex; align-items: center; gap: 9px; margin: 0 0 14px; color: #b8b6c2;
    font-size: 12px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
  .swatch { width: 9px; height: 9px; border-radius: 50%; background: #bfaaff; }
  .light .swatch { background: #356cc6; }
  .dark { --ha-card-background: #202127; --primary-text-color: #f6f4f8;
    --secondary-text-color: #aaa9b4; --primary-color: #c9b8ff;
    --secondary-background-color: #2d2e35; --divider-color: #393a42; }
  .light { --ha-card-background: #f9f8fc; --primary-text-color: #22232b;
    --secondary-text-color: #666977; --primary-color: #356cc6;
    --secondary-background-color: #eeeff5; --divider-color: #dfe1e8; }
  ha-worldclock-card { width: 100%; }
  ha-icon { display: inline-grid; place-items: center; width: var(--mdc-icon-size, 20px);
    height: var(--mdc-icon-size, 20px); }
  ha-icon svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  @media (max-width: 780px) { main { padding: 36px 16px; } .panels { grid-template-columns: 1fr; } }
</style>
<main>
  <div class="overline">Home Assistant custom card</div>
  <h1>World clock</h1>
  <p class="intro">The time where it matters, in one quiet place.</p>
  <div class="panels">
    <section class="dark"><div class="panel-label"><span class="swatch"></span>Dark theme</div><ha-worldclock-card id="dark"></ha-worldclock-card></section>
    <section class="light"><div class="panel-label"><span class="swatch"></span>Light theme</div><ha-worldclock-card id="light"></ha-worldclock-card></section>
  </div>
</main>
<script>
  class PreviewIcon extends HTMLElement {
    static get observedAttributes() { return ['icon']; }
    connectedCallback() { this.draw(); }
    attributeChangedCallback() { this.draw(); }
    draw() {
      const path = {
        'mdi:clock-outline': '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
        'mdi:weather-sunny': '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
        'mdi:moon-waning-crescent': '<path d="M19 15.5A8 8 0 0 1 8.5 5 8.5 8.5 0 1 0 19 15.5Z"/>',
        'mdi:earth': '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
      }[this.getAttribute('icon')] || '';
      this.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
    }
  }
  customElements.define('ha-icon', PreviewIcon);
</script>
<script type="module">
  import '../ha-worldclock-card.js';
  document.getElementById('dark').setConfig({
    title: 'World clock',
    hour_format: '12',
    show_time_zone: true,
    zones: [
      { name: 'San Francisco', timezone: 'America/Los_Angeles' },
      { name: 'New York', timezone: 'America/New_York' },
      { name: 'London', timezone: 'Europe/London' },
      { name: 'Tokyo', timezone: 'Asia/Tokyo' },
    ],
  });
  document.getElementById('light').setConfig({
    title: 'World clock',
    hour_format: '24',
    zones: [
      { name: 'Los Angeles', timezone: 'America/Los_Angeles' },
      { name: 'Berlin', timezone: 'Europe/Berlin' },
      { name: 'Sydney', timezone: 'Australia/Sydney' },
    ],
  });
</script>
</html>
